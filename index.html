async function readApiResponse(response){const text=await response.text();let result;
try{result=text?JSON.parse(text):{}}catch{throw new Error(`Server mengirim error ${response.status}: ${text.slice(0,160)||'respons tidak valid'}`)}
if(!response.ok)throw new Error(result.error||`Permintaan gagal (${response.status}).`);return result}
function renderOrderHistory(container,orders){container.replaceChildren();
if(!orders.length){container.textContent='Belum ada riwayat pesanan.';return}
const paymentLabels={creating:'Menyiapkan pembayaran',pending:'Menunggu pembayaran',completed:'Lunas',failed:'Pembayaran gagal'};
const orderLabels={menunggu_pembayaran:'Menunggu pembayaran',sedang_dibuat:'Pesanan sedang dibuat',selesai:'Selesai'};
orders.forEach(order=>{const item=document.createElement('div');item.className='history-item';
const heading=document.createElement('strong');heading.textContent=`${order.order_code} · ${new Date(order.created_at).toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}`;
const details=document.createElement('span');details.textContent=`${order.quantity} menu · ${paymentLabels[order.payment_status]||order.payment_status} · ${orderLabels[order.order_status]||order.order_status}`;
item.append(heading,details);container.append(item)})}
function route(){nav.classList.remove('open');const hashPath=location.hash.slice(1).split('?')[0],path=location.pathname.replace(/\/+$/,'')||'/',h=hashPath||(path==='/leonxlab'?'/leonxlab':'/'),p=P[h]?h:'/';
const a=$('#app');a.style.animation='none';a.offsetHeight;a.style.animation='';a.innerHTML=P[p]();scrollTo(0,0);
if(p==='/'){const hero=$('.hero.y .wrap > div:first-child');if(hero){const buy=document.createElement('a');buy.className='btn';buy.href='#/beli';buy.textContent='Beli Fishbao · Rp11.000';buy.style.margin='12px 0 0 10px';hero.append(buy)}}
document.querySelectorAll('.links a').forEach(l=>l.classList.toggle('act',l.getAttribute('href')=='#'+p));
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('on');io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
const photoSets={h:['assets/pelabuhan.jpg','assets/pasar-ikan.jpg','assets/hero-nelayan.jpg'],f:['assets/tumpukan-ikan.jpg','assets/ikan-keranjang.jpg','assets/ikan-tenggiri.jpg']};
document.querySelectorAll('.carousel').forEach(carousel=>{const key=carousel.classList.contains('f')?'f':'h',images=photoSets[key],cards=[...carousel.querySelectorAll('i')];let current=0;
const render=()=>cards.forEach((card,index)=>{card.dataset.position=(index-current+3)%3;card.style.backgroundImage=`url("${images[index]}")`});
carousel.querySelector('.prev').addEventListener('click',()=>{current=(current+2)%3;render()});
carousel.querySelector('.next').addEventListener('click',()=>{current=(current+1)%3;render()});render()});
const t=$('#tabs');if(t){const tp=$('#tp'),panels=[
['Cerita Pak Tono','Pak Tono merupakan salah satu nelayan yang memasok hasil tangkapan untuk ekosistem Ikanin.'],
['Hasil tangkapan','Hasil tangkapan yang ditampilkan mencakup Belo, bandeng, teri, dan cumi-cumi.'],

const show=index=>{tp.innerHTML=`<b>${panels[index][0]}</b><p>${panels[index][1]}</p>`};show(0);

const orderForm=$('#order-form');if(orderForm){const phone=$('#phone'),nameField=$('#name-field'),name=$('#customer-name'),message=$('#customer-message'),history=$('#order-history'),lookup=$('#lookup-customer'),status=$('#payment-status'),qrPanel=$('#qr-payment');let checkedPhone='';
const checkCustomer=async()=>{const value=phone.value.trim();if(!value)throw new Error('Masukkan nomor telepon terlebih dahulu.');
message.textContent='Memeriksa nomor dan riwayat pesanan...';
const response=await fetch('/api/customer-lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:value})}),result=await readApiResponse(response);
checkedPhone=value;renderOrderHistory(history,result.orders||[]);
if(result.registered){name.value=result.customer_name;name.required=false;nameField.hidden=true;message.textContent=`Halo, ${result.customer_name}. Riwayat pesanan kamu dimuat.`}
else{name.value='';name.required=true;nameField.hidden=false;message.textContent='Nomor belum terdaftar. Masukkan nama untuk membuat data pelanggan baru.'}
return result};
lookup.addEventListener('click',async()=>{lookup.disabled=true;try{await checkCustomer()}catch(error){message.textContent=error.message}finally{lookup.disabled=false}});
phone.addEventListener('input',()=>{checkedPhone='';nameField.hidden=true;name.required=false;history.replaceChildren();message.textContent='';status.textContent='';qrPanel.hidden=true});
orderForm.addEventListener('submit',async event=>{event.preventDefault();const button=orderForm.querySelector('[type="submit"]');button.disabled=true;status.textContent='Membuat pesanan dan QRIS...';qrPanel.hidden=true;
try{if(checkedPhone!==phone.value.trim())await checkCustomer();
if(!nameField.hidden&&name.value.trim().length<2)throw new Error('Nama wajib diisi untuk pelanggan baru.');
const response=await fetch('/api/create-transaction',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({phone:phone.value,name:name.value,quantity:Number($('#quantity').value)})}),result=await readApiResponse(response);
if(!result.qr_code||!result.order_code)throw new Error('QR pembayaran tidak lengkap. Silakan coba lagi.');
$('#qr-image').src=result.qr_code;$('#qr-details').textContent=`Pesanan ${result.order_code} · Total pembayaran Rp${Number(result.total_payment).toLocaleString('id-ID')} · Menunggu pembayaran`;
renderOrderHistory(history,[{order_code:result.order_code,created_at:result.created_at,quantity:result.quantity,payment_status:'pending',order_status:'menunggu_pembayaran'}]);
qrPanel.hidden=false;status.textContent='Pesanan sudah dibuat. Pindai QRIS untuk menyelesaikan pembayaran.';checkedPhone=phone.value.trim()}
catch(error){status.textContent=error.message||'Pesanan tidak dapat dibuat.'}finally{button.disabled=false}})}
if(p==='/leonxlab'){const body=$('#admin-orders'),message=$('#admin-message'),refresh=$('#refresh-admin');
const loadOrders=async()=>{refresh.disabled=true;message.textContent='Memuat daftar pesanan...';body.replaceChildren();
try{const result=await readApiResponse(await fetch('/api/admin-orders'));if(!result.orders.length){const row=body.insertRow();const cell=row.insertCell();cell.colSpan=8;cell.textContent='Belum ada pesanan.';message.textContent='0 pesanan.';return}
result.orders.forEach(order=>{const row=body.insertRow(),customer=Array.isArray(order.customers)?order.customers[0]:order.customers;
[new Date(order.created_at).toLocaleString('id-ID'),order.order_code,customer?.name||'-',customer?.phone||'-',String(order.quantity),`Rp${Number(order.total_payment||order.amount).toLocaleString('id-ID')}`,order.payment_status,order.order_status].forEach(value=>{row.insertCell().textContent=value})});message.textContent=`${result.orders.length} pesanan dimuat.`}
catch(error){message.textContent=error.message}finally{refresh.disabled=false}};
refresh.addEventListener('click',loadOrders);loadOrders()}
}
addEventListener('hashchange',route);addEventListener('scroll',()=>nav.classList.toggle('sm',scrollY>40),{passive:true});route();
</script></body></html>
