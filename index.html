<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ikanin.co</title><link rel="icon" href="assets/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFD233;--yd:#F2B705;--k:#1a1a1a;--bg:#f4f4f4;--sea:linear-gradient(160deg,#6f8fa3,#3d5a6b 55%,#2a3b45);--fish:linear-gradient(135deg,#c9d3d8,#8c9aa3 50%,#e8e2c8);--dark:linear-gradient(160deg,#2b3236,#0f1214);--sand:linear-gradient(160deg,#7fc3e0,#3f8fb5 60%,#d9b27a);padding-top:env(safe-area-inset-top,0)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Raleway,Arial,sans-serif;background:var(--bg);color:var(--k);overflow-x:hidden;line-height:1.5}
a{color:inherit;text-decoration:none}
#app{animation:in .6s ease both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.rv{opacity:0;transform:translateY(34px);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
.wrap{max-width:1180px;margin:0 auto;padding:0 32px}
nav{position:fixed;top:calc(34px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(94%,1180px);height:80px;background:#fff;border-radius:40px;box-shadow:0 6px 24px #0002;display:flex;align-items:center;justify-content:space-between;padding:0 32px;z-index:50;transition:.4s}
nav.sm{top:12px;height:64px;box-shadow:0 10px 30px #0003}
.logo{font-weight:800;font-size:26px;color:var(--yd);font-style:italic;letter-spacing:-1px}
.links{display:flex;gap:26px;font-size:14px;font-weight:500}
.links a{position:relative;padding:4px 0}
.links a:after{content:"";position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--y);transition:.3s}
.links a:hover:after,.links a.act:after{width:100%}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 30px;border-radius:30px;background:var(--y);font-weight:700;font-size:14px;border:0;cursor:pointer;transition:.3s}
.btn:hover{transform:translateY(-3px);box-shadow:0 8px 18px #0003}
.btn.dk{background:#1a1a1a;color:#fff}.btn.wh{background:#fff}
.burger{display:none;background:none;border:0;font-size:26px;cursor:pointer}
.hero{position:relative;min-height:640px;padding:200px 0 80px}
.hero.y{background:linear-gradient(#FFD233 0,#fff3c0 28%,var(--bg) 60%);overflow:hidden}
.hero.y:before{content:"";position:absolute;left:-90px;top:340px;width:420px;height:300px;background:#ffe9a8;border-radius:50% 60% 40% 70%;transform:rotate(-20deg);opacity:.7;animation:fl 8s ease-in-out infinite}
@keyframes fl{50%{transform:rotate(-12deg) translateY(-18px)}}
.hero.dk{color:#fff;display:flex;align-items:center;min-height:630px}
.hero.dk .ov{position:absolute;inset:0;background:var(--dark);opacity:.88;z-index:0}
.hero.dk .wrap{position:relative;z-index:1}
h1{font-size:clamp(38px,5.4vw,60px);line-height:1.1;font-weight:700}
h2{font-size:clamp(28px,3.6vw,42px);line-height:1.2;font-weight:700}
h1 b,h2 b{color:var(--y)}
.hero p{max-width:480px;font-size:14px;margin:26px 0 52px}
.cols{display:flex;align-items:center;justify-content:space-between;gap:40px}
.stack{position:relative;width:300px;height:300px;flex:none}
.stack i{position:absolute;inset:0;border-radius:24px;box-shadow:0 10px 30px #0003;transition:.6s cubic-bezier(.2,.7,.2,1)}
.stack i:nth-child(1){background:#9fb3c8;transform:rotate(14deg) translate(34px,-6px)}
.stack i:nth-child(2){background:#7fa0b7;transform:rotate(7deg) translate(18px,-2px)}
.stack i:nth-child(3){background:var(--sea);border:6px solid #fff}
.stack.fish i:nth-child(3){background:var(--fish)}.stack.man i:nth-child(3){background:var(--sand)}
.stack:hover i:nth-child(1){transform:rotate(20deg) translate(54px,-10px)}.stack:hover i:nth-child(2){transform:rotate(10deg) translate(28px,-4px)}
.stack.big{width:300px;height:380px}.hero .stack{width:310px;height:300px;margin-right:60px}
section{padding:80px 0}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:40px}
.hd p{max-width:340px;text-align:right;font-size:14px}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:46px;margin-top:50px}
.card{position:relative;height:410px;border-radius:26px;overflow:hidden;color:#fff;text-align:center;padding:22px 30px;background:var(--sea);isolation:isolate}
.card:after{content:"";position:absolute;inset:0;background:#0006;z-index:-1}
.card.f{background:var(--fish)}
.card:hover{transform:translateY(-8px) scale(1.01)}.card{transition:.5s}
.card h3{font-size:20px;margin-bottom:8px}.card p{font-size:13px}
.map{display:block;margin:30px auto 0;max-width:820px;width:100%}
.map circle{fill:#999;opacity:0;animation:dot .6s forwards}
@keyframes dot{to{opacity:1}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;padding:70px 40px}
.stats h2{font-size:clamp(48px,6vw,72px)}.stats p{font-size:13px;max-width:200px;margin-top:6px}
.cta{background:var(--y);text-align:center;padding:100px 20px 110px}
.cta h2{font-size:clamp(30px,4.6vw,54px);font-weight:700;max-width:820px;margin:0 auto 54px}
.store{display:inline-flex;align-items:center;gap:10px;background:#111;color:#fff;border-radius:30px;padding:11px 22px;margin:6px;font-weight:700;font-size:16px;line-height:1.1;transition:.3s}
.store small{display:block;font-size:9px;font-weight:400}.store:hover{transform:translateY(-4px)}
footer{padding:60px 0 40px}
footer .wrap{display:flex;justify-content:space-between;gap:30px;flex-wrap:wrap}
footer h4{font-size:20px}footer p{font-size:13px;max-width:210px;margin-top:10px}
.fl{display:grid;grid-template-columns:auto auto;gap:22px 80px;font-size:14px;align-content:start}
.line{height:1px;background:#222;margin:50px auto 0;width:calc(100% - 64px);max-width:1116px}
.tags{display:flex;flex-wrap:wrap;gap:10px}
.tags span{border:1px solid #444;border-radius:20px;padding:2px 14px;font-size:13px;color:#777;transition:.3s}.tags span:hover{background:var(--y);color:#000;border-color:var(--y)}
.pf{position:relative;margin-top:-90px;padding:0}
.pfg{display:grid;grid-template-columns:310px 1fr;gap:12px;align-items:start}
.box{background:#fff;padding:26px;border-radius:2px}
.av{width:210px;height:210px;border-radius:50%;background:#eee;margin:10px auto 22px;position:relative;overflow:hidden}
.av:before{content:"";position:absolute;width:62px;height:62px;border-radius:50%;background:#fff;left:74px;top:44px}
.av:after{content:"";position:absolute;width:112px;height:80px;border-radius:50% 50% 0 0;background:#fff;left:49px;top:118px}
.tabs{display:flex;justify-content:space-around;border-bottom:1px solid #ddd;font-size:14px;overflow-x:auto}
.tabs button{background:none;border:0;padding:20px 18px;font:inherit;color:#777;cursor:pointer;position:relative;white-space:nowrap}
.tabs button.act{color:var(--y)}
.tabs button:after{content:"";position:absolute;left:50%;bottom:-1px;height:2px;width:0;background:var(--y);transition:.3s;transform:translateX(-50%)}
.tabs button.act:after{width:80%}
.tp{padding:34px 40px 60px;font-size:14px;min-height:300px}
.tp p{margin:16px 0 16px 28px;max-width:520px;animation:in .5s both}
.big-ph{height:500px;background:#d9d9d9}
.ben{text-align:right;max-width:430px}.ben h3{font-size:22px;margin:0 0 8px}.ben p{font-size:14px;margin-bottom:26px}
.diag{display:grid;grid-template-columns:repeat(3,1fr);gap:26px 20px;margin-top:50px;font-size:14px;align-items:center}
.diag div{transition:.3s}.diag div:hover{transform:translateY(-4px)}
.diag b{display:block;text-transform:uppercase;font-size:14px}
.diag svg{grid-column:1/-1;width:100%;max-height:150px}
.team{display:grid;gap:18px;text-align:right;font-size:13px}
@media(max-width:860px){
.links,nav>.btn{display:none}.burger{display:block}
nav{height:64px;padding:0 20px;top:calc(16px + env(safe-area-inset-top,0px))}
nav.open{border-radius:28px;height:auto;flex-wrap:wrap;padding:12px 20px 20px}
nav.open .links{display:flex;flex-direction:column;width:100%;order:3;gap:14px;padding:12px 0}
nav.open>.btn{display:inline-flex;order:4}
.wrap{padding:0 20px}.hero{padding-top:130px;min-height:0}
.cols,.hd{flex-direction:column;align-items:flex-start}.hd p{text-align:left}
.hero .stack,.stack{margin:30px 20px 0 0;width:min(78vw,300px)}.cards,.stats{grid-template-columns:1fr}.card{height:320px}
.pfg{grid-template-columns:1fr}.diag{grid-template-columns:1fr 1fr}.ben,.team{text-align:left}
.tp{padding:24px 20px}.tp p{margin-left:0}.big-ph{height:260px}.fl{gap:18px 40px}.stats{padding:40px 10px}
}
.logo img{height:36px;display:block;transition:.3s}.logo:hover img{transform:scale(1.06) rotate(-3deg)}
.map{mix-blend-mode:multiply}.diagimg{display:block;width:100%;max-width:1000px;margin:0 auto;mix-blend-mode:multiply}
.card{background:url(assets/kapal-nelayan.jpg) center/cover}.card.f{background:url(assets/ikan-tenggiri.jpg) center/cover}
.big-ph{background:#d9d9d9 url(assets/pasar-ikan.jpg) center/cover}
.stack i{background-size:cover!important;background-position:center!important}
.stack.h i:nth-child(1){background-image:url(assets/pelabuhan.jpg)}.stack.h i:nth-child(2){background-image:url(assets/pasar-ikan.jpg)}.stack.h i:nth-child(3){background-image:url(assets/hero-nelayan.jpg)}
.stack.f i:nth-child(1){background-image:url(assets/tumpukan-ikan.jpg)}.stack.f i:nth-child(2){background-image:url(assets/ikan-keranjang.jpg)}.stack.f i:nth-child(3){background-image:url(assets/ikan-tenggiri.jpg)}
.stack.m i:nth-child(1){background-image:url(assets/pelabuhan.jpg)}.stack.m i:nth-child(2){background-image:url(assets/hero-nelayan.jpg)}.stack.m i:nth-child(3){background-image:url(assets/kapal-nelayan.jpg)}
@media(max-width:860px){.logo img{height:30px}}
.suit{display:block;width:min(100%,340px);height:auto;margin-bottom:-1px}@media(max-width:860px){.suit{margin:0 auto}}
.hero.y:before{z-index:0;pointer-events:none}.hero.y .wrap{position:relative;z-index:1}
</style></head><body>
<nav id="nav"><a class="logo" href="#/"><img src="assets/logo.png" alt="Ikanin"></a>
<div class="links"><a href="#/nelayan">Profil Nelayan</a><a href="#/ikan">Profil Ikan</a><a href="#/tentang">Tentang Kami</a></div>
<a class="btn" href="#/">Daftar</a><button class="burger" onclick="nav.classList.toggle('open')" aria-label="Menu">☰</button></nav>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s);
const cta=`<div class="cta rv"><h2>Menyajikan kebaikan gizi murni dari laut nelayan pilihan</h2><a class="store" href="#"><svg width="24" height="28" viewBox="0 0 24 28"><path fill="#fff" d="M17 15c0-3 2.5-4 2.6-4.1-1.4-2-3.600-2.300-4.400-2.300-1.900-.2-3.600 1.100-4.600 1.100s-2.400-1.100-4-1C4.600 8.700 2.700 9.900 1.700 11.800c-2.100 3.600-.5 9 1.500 12 1 1.400 2.200 3 3.700 3 1.500-.1 2-1 3.800-1s2.300 1 3.800.9c1.600 0 2.600-1.500 3.600-2.900 1.100-1.600 1.600-3.200 1.600-3.300-.1 0-3.200-1.200-3.200-4.500zM14 6c.8-1 1.400-2.400 1.200-3.800-1.200.1-2.700.8-3.500 1.800-.8.900-1.400 2.300-1.200 3.700 1.300.1 2.700-.700 3.500-1.700z"/></svg><span><small>Download on the</small>App Store</span></a><a class="store" href="#"><svg width="24" height="26" viewBox="0 0 24 26"><path fill="#34a853" d="M2 1l11 12L2 25z"/><path fill="#fbbc04" d="M13 13l4-4 6 3.500c1 .6 1 1.400 0 2L17 18z"/><path fill="#ea4335" d="M2 25l11-12 4 5z"/><path fill="#4285f4" d="M2 1l15 8-4 4z"/></svg><span><small>DISPONIBLE SUR</small>Google Play</span></a></div>`;
const foot=(w)=>`<footer><div class="wrap"><div><h4>Ikanin.co</h4><p>Mari bersama mendukung keberlanjutan sektor perikanan lokal dan pemenuhan gizi sehat keluarga Indonesia.</p></div><div class="fl"><span>Email</span><span>ikaniiinn@gmail.com</span><span>WhatsApp</span><span>${w}</span><span>Instagram</span><span>@ikanin.co</span></div></div><div class="line"></div></footer>`;
const lorem=`We help you learn language easily, witjh small lessons , you'll earn points and unlock new levels while improving you rel world communications.`;
// dotted map
const rows=["  ..                                    ","  ..........    ....   ..         ....  ","   ..........  ........ ....      ......","    ........  ..........  ..    ..  .....","     .......  ..........   .. ...  ......","      ......  ..........  .....    ......","       .....   ........   ..  ..   ......","  .....................    ..  ..  .... ","     ................. ..   ..       ...."];
function map(){let s='<svg class="map" viewBox="0 0 400 100">',n=0;rows.forEach((r,y)=>[...r].forEach((c,x)=>{if(c=='.')s+=`<circle cx="${x*10+6}" cy="${y*10+8}" r="3.200" style="animation-delay:${(n++)*12}ms"/>`}));return s+'</svg>'}
const P={
'/':()=>`<section class="hero y"><div class="wrap cols"><div><h1>Inovasi Ikan<br><b>Lezat Bernutrisi?</b></h1><p>Menghubungkan kebaikan gizi murni hasil laut Indonesia langsung dari nelayan lokal menuju meja konsumen melalui ekosistem digital terintegrasi.</p><a class="btn dk" href="#/nelayan">Ayo Jelajahi Ekosistem Ikanin! ↗</a></div><div class="stack h rv"><i></i><i></i><i></i></div></div></section>
<section><div class="wrap"><div class="hd rv"><h2>Dari laut <b>langsung</b> ke<br>tangan kamu!</h2><p>Model distribusi langsung dari nelayan untuk menjaga kualitas kesegaran ikan serta memastikan harga yang sesuai bagi nelayan dan konsumen.</p></div>
<div class="cards"><div class="card rv"><h3>Bagaimana Kita Membantu Nelayan?</h3><p>Meningkatkan kesejahteraan nelayan dengan mengubah jenis ikan bernilai rendah menjadi komoditas berdaya saing tinggi.</p></div><div class="card f rv"><h3>Kenapa Harus Ikanin?</h3><p>Ikanin menyajikan ikan segar tanpa pengawet buatan, dikemas higienis dengan kontrol rantai dingin ketat.</p></div></div></div></section>
<section style="padding-top:20px"><div class="wrap rv" style="text-align:center"><h2>Ketahui Persebaran Ikan Belo di Laut Indonesia</h2><p style="font-size:13px;margin-top:22px">Di bawah ini merupakan pemetaan zona perairan utama penghasil Ikan Belo dengan potensi hilirisasi bernilai tinggi</p><img class="map" src="assets/peta-indonesia.png" alt="Peta persebaran Ikan Belo" loading="lazy"></div>
<div class="wrap stats rv"><div><h2>3JT+</h2><p>Persebaran Nelayan Di Indonesia</p></div><div><h2>25%</h2><p>Dari Total Kemiskinan Nasional Adalah Nelayan</p></div><div><h2>550K+</h2><p>Ton Volume Hasil Tangkapan Ikan Belo Pertahunnya Di Indonesia Yang Berpotensi Besar Meningkatkan Pendapatan Nelayan.</p></div></div></section>${cta}${foot('08-')}`,
'/ikan':()=>`<section class="hero dk" style="background:url(assets/tumpukan-ikan.jpg) center/cover"><div class="ov" style="opacity:.68"></div><div class="wrap"><h1>Kenalin Aku Belo,<br><b>Kaya Omega-3!</b></h1><p style="margin-bottom:34px">Aku si kecil kaya potensi yang bikin tubuh kamu makin fit, dan bikin para nelayan lokal makin tersenyum sejahtera!</p><a class="btn wh" href="#profil">Cari Tahu Tentang Aku Disini!</a></div></section>
<section id="profil"><div class="wrap"><div class="hd rv"><h2>Aku datang dengan<br>berbagai khasiat aku loh!</h2><p>Mau tahu apa aja kandungan di dalam diri aku? Yuk simak lebih lanjut.</p></div>
<div class="cols" style="margin-top:50px"><div class="stack f big rv"><i></i><i></i><i></i></div><div class="ben rv"><h3>Otak Kamu Bakal Makin Encer dan Focal!</h3><p>Kandungan DHA &amp; EPA murni pada tubuhku diserap tubuh kamu 2x lebih cepat dibanding suplemen biasa.</p><h3>Aku Menyehatkan Jantung dan Kulit Kamu!</h3><p>Perpaduan Taurin &amp; Kolagen laut bikin pembuluh darah kamu lentur dan kulit kamu tetap elastis bercahaya.</p></div></div></div></section>
<section style="padding-top:10px"><div class="wrap rv"><img class="diagimg" src="assets/profil-gizi-belo.jpg" alt="Profil gizi Ikan Belo" loading="lazy"></div></section>${cta}${foot('Privacy Policy')}`,
'/nelayan':()=>`<section class="hero" style="min-height:0;padding:0;height:260px;background:url(assets/ikan-keranjang.jpg) center/cover;overflow:hidden"><div style="position:absolute;inset:0;background:#7d848a;opacity:.62"></div></section>
<div style="height:300px;background:linear-gradient(#FFD233,var(--bg));margin-top:0;position:absolute;width:100%;top:260px;z-index:0"></div>
<div class="wrap pf" style="position:relative;z-index:2;margin-top:-66px"><div class="pfg"><div><div class="box rv" style="text-align:center;min-height:380px"><div class="av"></div><b>Pak Tono</b><p style="font-size:13px;margin:10px 0">Pemasok Utama Ikan Belo Ikanin</p><p style="font-size:13px;color:#999">Pelabuhan Muara Angke, Jakarta Pusat</p></div>
<div class="box rv" style="margin-top:10px"><b style="font-size:13px;display:block;margin-bottom:12px">Tangkapan saat berlayar:</b><div class="tags"><span>Belo</span><span>Bandeng</span><span>Teri</span><span>Cumi-cumi</span><span>Teri</span><span>Cumi-cumi</span><span>Ikan not loving you</span><span>Bandeng</span></div></div></div>
<div class="rv" style="background:#fff;margin-top:68px;min-height:490px"><div class="tabs" id="tabs"><button class="act">Meet the fisherman</button><button>Meet the fisherman</button><button>Meet the fisherman</button><button>Meet the fisherman</button></div><div class="tp" id="tp"></div></div></div></div>
<section><div class="wrap"><div class="hd rv"><h2>Apa aja yang bisa kita<br>bantu bersama untuk<br>mereka?</h2><p>Ketahui bagaimana gambaran dampak yang akan terjadi di masa depan berkat Ikanin?</p></div></div><div class="big-ph rv" style="margin-top:40px"></div></section>${cta}${foot('Privacy Policy')}`,
'/tentang':()=>`<section class="hero dk" style="background:url(assets/pelabuhan.jpg) center/cover;min-height:570px;text-align:center"><div class="ov" style="opacity:.72"></div><div class="wrap"><h1>Orang-Orang<br>Dibalik <b>Ikanin</b></h1></div></section>
<section><div class="wrap"><h2 class="rv">Visi dan Misi Ikanin</h2><div class="cols" style="margin-top:70px"><div class="stack m rv"><i></i><i></i><i></i></div><div class="ben rv" style="max-width:420px"><h3>VISI</h3><p>Untuk mengubah hasil tangkapan yang selama ini terabaikan menjadi peluang bermakna bagi para nelayan, konsumen, dan masa depan lautan kita.</p><h3>MISI</h3><p>Kami menciptakan produk pangan bergizi dan inovatif dari ikan yang belum dimanfaatkan secara optimal, membangun peluang pasar yang berkelanjutan bagi para nelayan, serta menghubungkan setiap konsumen dengan kisah dan dampak di balik makanan mereka.</p></div></div></div></section>
<section style="padding-top:0"><div class="wrap"><div class="cols" style="align-items:flex-start"><h2 class="rv">Divisi Ikanin</h2><div class="team rv"><span>Ketua Pelaksana : Sastriawati Nur Zahra</span><span>Kepala Pemasaran:<br>Ratu Beruntung Alicia Pasaribu</span><span>Tim Petugas Pemasaran:<br>Abyan Fauzul Fatih<br>Muhammad Rakha Habil</span><span>Kepala Bagian Produksi:<br>Alya Dzakiyah Darussalam</span><span>Tim Petugas Produksi:<br>Naufal Islami Pasha<br>Manurung Leonard Togi<br>Khoirun Nashila</span><span>Kepala Pejabat Keuangan:<br>Naufa Holisa Abdullah</span><span>Tim Petugas Keuangan:<br>Muhammad Syamil Annashiri<br>Ahmad Fathir Akbar</span></div></div><div class="stack m rv" style="margin-top:-380px"><i></i><i></i><i></i></div></div></section>
<section style="padding-top:0"><div class="wrap cols" style="align-items:flex-end"><div class="rv" style="max-width:360px;font-size:13px"><p>${lorem} ${lorem}</p><br><p>${lorem}</p><br><p>${lorem} ${lorem}</p></div><img class="rv suit" src="assets/pria-berjas.png" alt="Tim Ikanin" loading="lazy"></div></section>${cta}${foot('Privacy Policy')}`};
function route(){nav.classList.remove('open');const h=location.hash.slice(1)||'/',p=P[h]?h:'/';
const a=$('#app');a.style.animation='none';a.offsetHeight;a.style.animation='';a.innerHTML=P[p]();scrollTo(0,0);
document.querySelectorAll('.links a').forEach(l=>l.classList.toggle('act',l.getAttribute('href')=='#'+p));
const io=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add('on');io.unobserve(x.target)}}),{threshold:.12});
document.querySelectorAll('.rv').forEach(el=>io.observe(el));
const t=$('#tabs');if(t){const tp=$('#tp'),sh=()=>tp.innerHTML=`<b style="font-size:13px">Yuk Simak Cerita Pak Tono!</b><p>${lorem}</p><p>${lorem} ${lorem}</p><p>${lorem}</p>`;sh();
t.querySelectorAll('button').forEach(b=>b.onclick=()=>{t.querySelectorAll('button').forEach(x=>x.classList.remove('act'));b.classList.add('act');sh()})}}
addEventListener('hashchange',route);addEventListener('scroll',()=>nav.classList.toggle('sm',scrollY>40),{passive:true});route();
</script></body></html>
